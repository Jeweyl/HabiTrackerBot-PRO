services:
  postgres:
    image: postgres:15-alpine
    container_name: habits_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habits_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habits_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: habits_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habits_bot
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  # Optional read-only stats API (C1) — same image, separate process
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habits_api
    restart: "no"
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"

  # Vue dashboard (C2) — nginx SPA + /api proxy to api:8000
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: habits_web
    restart: "no"
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:



